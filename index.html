        b.style.transform = `translate(${x}px,${y0}px)`; field.appendChild(b);
        const o = { b, v, x, y0, ok: v === f.v };
        b.onclick = () => {
          if (over || b.classList.contains('x')) return;
          if (o.ok) {
            over = true; cancelAnimationFrame(raf); b.classList.add('pop');
            if (!wrongTaps) { right++; combo++; hit(it.id); } else { missed(it.id); }
            pts += wrongTaps ? 5 : 10 + combo * 2; hud();
            toast(`<b>${esc(f.v)}</b> · ${esc(f.p)} <span class="src">${esc(secLabel(it.src))}</span>`, 1300, () => { k++; round(); });
          } else { wrongTaps++; combo = 0; buzz(); b.classList.add('x', 'shake'); hud(); }
        };
        return o;
      });
      const t0 = performance.now();
      const tick = now => {
        const dy = speed * (now - t0) / 1000;
        let escaped = false;
        bubs.forEach(o => { const y = o.y0 - dy; o.b.style.transform = `translate(${o.x}px,${y}px)`; if (o.ok && y < -70) escaped = true; });
        if (escaped && !over) {
          over = true; combo = 0; missed(it.id); hud();
          return toast(`It was <b>${esc(f.v)}</b> · ${esc(f.p)} <span class="src">${esc(secLabel(it.src))}</span>`, 1800, () => { k++; round(); });
        }
        if (!over) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    };
    requestAnimationFrame(round);
  }

  // ── step: swipe sort ──
  function stepSort(stage, ctx, done) {
    const g = ctx.g, items = shuffle(g.items).slice(0, 9);
    let k = 0, right = 0, streak = 0, timer = 0;
    onLeave(() => clearTimeout(timer));
    const show = () => {
      if (k >= items.length) return done(right, items.length);
      const it = items[k], secs = Math.max(6, 11 - streak * 0.6);
      stage.innerHTML = `<div class="hud"><span>card <b>${k + 1}</b>/${items.length}</span><span>streak <b>${streak}</b></span></div>
        <div class="card sortcard">${esc(it.t)}</div>
        <div class="timer"><i data-t style="transition:transform ${secs}s linear"></i></div>
        <div class="bins" style="${g.bins.length === 2 ? '' : ''}">${g.bins.map((b, i) => `<button class="bin" data-b="${i}">${esc(b)}</button>`).join('')}</div>
        <div data-fb style="min-height:44px"></div>`;
      const bar = stage.querySelector('[data-t]');
      requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transform = 'scaleX(0)'; }));
      let done1 = false;
      const answer = pick => {
        if (done1) return; done1 = true; clearTimeout(timer);
        const ok = pick === it.b;
        stage.querySelectorAll('.bin').forEach(b => { b.disabled = true; if (+b.dataset.b === it.b) b.classList.add('right'); else if (+b.dataset.b === pick) b.classList.add('wrong', 'shake'); });
        if (ok) { right++; streak++; } else { streak = 0; buzz(); }
        stage.querySelector('[data-fb]').innerHTML = `<div class="fb"><b>${pick === -1 ? 'time’s up.' : ok ? 'right.' : 'not quite.'}</b>It goes in <b style="display:inline">${esc(g.bins[it.b])}</b>. <span class="src">${esc(secLabel(g.src))}</span></div>`;
        timer = setTimeout(() => { k++; show(); }, ok ? 900 : 1900);
      };
      on(stage, '[data-b]', b => answer(+b.dataset.b));
      timer = setTimeout(() => answer(-1), secs * 1000);
    };
    show();
  }

  // ── step: match (who's who) ──
  function pairsFor(g) {
    if (g.mode === 'role') return D.founders.map(f => ({ l: f.name, ini: f.ini, r: f.role }));
    if (g.mode === 'lede') return D.parts.map(p => ({ l: `Part ${p.n} · ${p.title}`, r: p.lede }));
    return g.pairs.map(([l, r]) => ({ l, r }));
  }
  function stepMatch(stage, ctx, done) {
    const all = shuffle(pairsFor(ctx.g)), rounds = [];
    for (let i = 0; i < all.length; i += 4) rounds.push(all.slice(i, i + 4));
    let ri = 0, clean = 0, mistakes = 0, t0 = performance.now(), iv = 0;
    onLeave(() => clearInterval(iv));
    const play = () => {
      if (ri >= rounds.length) { clearInterval(iv); return done(clean, all.length); }
      const ps = rounds[ri], rights = shuffle(ps.map((p, i) => ({ r: p.r, i })));
      const tried = new Set(); let sel = null, matched = 0;
      stage.innerHTML = `<div class="hud"><span>set <b>${ri + 1}</b>/${rounds.length}</span><span>misses <b data-m>${mistakes}</b></span><span><b data-s>0</b>s</span></div>
        <p class="muted" style="margin:0;font-size:14px">Tap a left tile, then its match on the right.</p>
        <div class="match"><div class="col">${ps.map((p, i) => `<button class="mt" data-l="${i}">${p.ini ? `<span class="av">${p.ini}</span>` : ''}<span>${esc(p.l)}</span></button>`).join('')}</div>
        <div class="col">${rights.map(x => `<button class="mt" data-r="${x.i}">${esc(x.r)}</button>`).join('')}</div></div>
        <div class="src">${esc(secLabel(ctx.g.src))}</div>`;
      clearInterval(iv); iv = setInterval(() => { const s = stage.querySelector('[data-s]'); if (s) s.textContent = Math.round((performance.now() - t0) / 1000); }, 500);
      on(stage, '[data-l]', el => { if (el.classList.contains('done')) return; stage.querySelectorAll('[data-l]').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); sel = +el.dataset.l; });
      on(stage, '[data-r]', el => {
        if (sel == null || el.classList.contains('done')) return;
        const ok = ps[+el.dataset.r].r === ps[sel].r;
        const L = stage.querySelector(`[data-l="${sel}"]`);
        if (ok) {
          L.classList.remove('sel'); L.classList.add('done'); el.classList.add('done');
          if (!tried.has(sel)) clean++;
          matched++; sel = null;
          if (matched === ps.length) setTimeout(() => { ri++; play(); }, 500);
        } else { tried.add(sel); mistakes++; buzz(); el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); stage.querySelector('[data-m]').textContent = mistakes; }
      });
    };
    play();
  }

  // ── step: order (flow chain) ──
  function stepOrder(stage, ctx, done) {
    const g = ctx.g, n = g.items.length;
    let next = 0, clean = 0, missThis = false;
    const pool = shuffle(g.items.map((t, i) => i));
    const draw = () => {
      stage.innerHTML = `<div class="hud"><span>linked <b>${next}</b>/${n}</span><span>first-try <b>${clean}</b></span></div>
        <p class="muted" style="margin:0;font-size:14px">${esc(g.hint || 'Tap the steps in the right order.')}</p>
        <div class="chain">${g.items.slice(0, next).map((t, i) => `<div class="link"><span class="n">${i + 1}</span><span>${esc(t)}<small>${esc(g.notes[i])}</small></span></div>`).join('')}</div>
        <div class="pool">${pool.filter(i => i >= next).map(i => `<button class="opt" data-o="${i}">${esc(g.items[i])}</button>`).join('')}</div>
        <div class="src">${esc(secLabel(g.src))}</div>`;
      on(stage, '[data-o]', el => {
        if (+el.dataset.o === next) { if (!missThis) clean++; missThis = false; next++; if (next === n) { draw(); setTimeout(() => done(clean, n), 1100); } else draw(); }
        else { missThis = true; buzz(); el.classList.add('wrong', 'shake'); setTimeout(() => el.classList.remove('wrong', 'shake'), 500); }
      });
    };
    draw();
  }

  // ── step: quote builder ──
  function stepQuote(stage, ctx, done) {
    const scen = shuffle(D.quotes).slice(0, 2);
    let k = 0, right = 0;
    const play = () => {
      if (k >= scen.length) return done(right, scen.length);
      const sc = scen[k], cnt = {}; D.priceList.forEach(x => { cnt[x.id] = 0; });
      let shown = 0, anim = 0;
      stage.innerHTML = `<div class="hud"><span>quote <b>${k + 1}</b>/${scen.length}</span><span>prices exclude VAT</span></div>
        <div class="card"><p class="lab">the brief</p><p style="margin:0;font-size:17px;font-weight:600">${esc(sc.brief)}</p></div>
        <div class="plist">${D.priceList.map(x => `<div class="pi"><span class="nm">${esc(x.name)}</span><span class="pr">${R(x.price)}</span>
          <div class="step"><button data-m="${x.id}" aria-label="remove">−</button><span data-c="${x.id}">0</span><button data-p="${x.id}" aria-label="add">+</button></div></div>`).join('')}</div>
        <div class="total"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lab" style="margin:0">quote total</span><span class="amt" data-amt>R 0</span></div>
          <div data-fb></div><button class="btn" data-check>check quote</button></div>`;
      onLeave(() => cancelAnimationFrame(anim));
      const sum = () => D.priceList.reduce((a, x) => a + x.price * cnt[x.id], 0);
      const roll = () => {
        cancelAnimationFrame(anim); const target = sum(), from = shown, t0 = performance.now();
        const f = now => { const p = Math.min(1, (now - t0) / 350); shown = Math.round(from + (target - from) * p); stage.querySelector('[data-amt]').textContent = R(shown); if (p < 1) anim = requestAnimationFrame(f); };
        anim = requestAnimationFrame(f);
      };
      const set = (id, d) => { cnt[id] = Math.max(0, Math.min(24, cnt[id] + d)); stage.querySelector(`[data-c="${id}"]`).textContent = cnt[id]; roll(); };
      on(stage, '[data-p]', el => set(el.dataset.p, 1));
      on(stage, '[data-m]', el => set(el.dataset.m, -1));
      on(stage, '[data-check]', btn => {
        const ok = D.priceList.every(x => (sc.need[x.id] || 0) === cnt[x.id]);
        if (ok) right++; else buzz();
        const lines = Object.keys(sc.need).map(id => { const x = D.priceList.find(y => y.id === id); return `${sc.need[id]} × ${x.name} (${R(x.price)})`; }).join(' + ');
        stage.querySelector('[data-fb]').innerHTML = `<div class="fb"><b>${ok ? 'quote correct.' : 'not quite.'}</b>${esc(lines)} = <b style="display:inline">${R(sc.total)}</b>. <span class="src">${esc(secLabel(sc.src))}</span></div>`;
        stage.querySelectorAll('.step button').forEach(b => { b.disabled = true; });
        btn.textContent = 'next'; btn.onclick = () => { k++; play(); };
      });
    };
    play();
  }

  // ── step: panel hot seat ──
  function stepHotseat(stage, ctx, done, itemsIn, secs) {
    const items = itemsIn || shuffle(BANK.filter(x => x.part === ctx.part.n && x.kind === 'panel')).slice(0, 3);
    let k = 0, r = 0;
    const ask = () => {
      if (k >= items.length) return done(r, items.length);
      mcq(stage, items[k], {
        timer: secs || 30,
        head: `${panelSvg()}<div style="display:flex;align-items:center;gap:14px">${ringSvg()}<div style="flex:1"><div class="hud" style="margin-bottom:6px"><span>question <b>${k + 1}</b>/${items.length}</span><span>confidence</span></div><div class="meter"><i style="width:${items.length ? Math.round(r / items.length * 100) : 0}%"></i></div></div></div>
          <p class="lab" style="margin:0">the panel asks${items[k].part && itemsIn ? ' · part ' + items[k].part : ''}</p>`,
        onAnswer: ok => { if (ok) { const m = stage.querySelector('.meter i'); if (m) m.style.width = Math.round((r + 1) / items.length * 100) + '%'; } },
        onDone: ok => { if (ok) r++; k++; ask(); }
      });
    };
    ask();
  }

  // ── step: hand-over ──
  function stepHand(stage, ctx, done) {
    const it = BY_ID[`p${ctx.part.n}h`];
    mcq(stage, it, { head: `<p class="muted" style="margin:0">Every part passes something to the next. Get the hand-over right and the 45 minutes flows.</p>`, nextLabel: 'finish', onDone: ok => done(ok ? 1 : 0, 1) });
  }

  const STEPS = { brief: stepBrief, recall: stepRecall, catch: stepCatch, sort: stepSort, match: stepMatch, order: stepOrder, quote: stepQuote, hotseat: stepHotseat, hand: stepHand };

  // ── results ──
  function confetti() {
    const c = document.createElement('div'); c.className = 'confetti';
    const cols = ['#E23B2E', '#16161A', '#2C3742', '#6E6C66'];
    for (let i = 0; i < 36; i++) { const d = document.createElement('i'); d.style.left = rand(100) + '%'; d.style.background = cols[i % 4]; d.style.animationDelay = (Math.random() * 0.6) + 's'; c.appendChild(d); }
    document.body.appendChild(c); setTimeout(() => c.remove(), 2600);
  }
  function result(o) {
    const main = screen(`
      <div><p class="lab">mission complete</p><h1>${esc(o.title)}</h1></div>
      <div class="card" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center">
        <span class="dot"></span><div class="big">${Math.round(o.pct * 100)}%</div><div class="bigstars">${starStr(o.stars)}</div>
        <p class="muted" style="margin:0">${o.stars === 3 ? 'Presentation ready.' : o.stars === 2 ? 'Nearly there. One more run.' : 'Good start. Play again: retrieval is how it sticks.'}</p>
      </div>
      ${o.handover ? `<div class="card"><p class="lab">the hand-over</p><p style="margin:0;font-weight:600">${esc(o.handover)}</p></div>` : ''}
      <div class="spacer"></div>
      <div class="row"><button class="btn ghost" data-a>play again</button>${o.next ? `<button class="btn" data-n>${esc(o.nextLabel)}</button>` : ''}</div>
      <button class="btn ghost" data-h>home</button>`, { back: home, backLabel: 'home' });
    if (o.stars === 3) confetti();
    on(main, '[data-a]', o.again); on(main, '[data-n]', o.next); on(main, '[data-h]', home);
  }

  // ── section test ──
  function sectionSetup(n) {
    let part = n, picked = new Set();
    const draw = () => {
      const pool = BANK.filter(x => x.part === part);
      const chips = [...new Set(pool.map(x => chipOf(x.src)))].sort((a, b) => a === 'flow' ? 1 : b === 'flow' ? -1 : a.localeCompare(b, 'en', { numeric: true }));
      const sel = pool.filter(x => !picked.size || picked.has(chipOf(x.src)));
      const main = screen(`
        <div><p class="lab">section test</p><h1>test one part</h1></div>
        <div><p class="lab">part</p><div class="chips">${D.parts.map(p => `<button class="chip ${p.n === part ? 'on' : ''}" data-p="${p.n}">${p.n}</button>`).join('')}</div></div>
        <div class="card"><p class="lab">part ${part} · ${esc(PART[part].presenter)}</p><h2>${esc(PART[part].title)}</h2></div>
        <div><p class="lab">narrow to sub-sections (optional)</p><div class="chips"><button class="chip ${picked.size ? '' : 'on'}" data-all>all</button>${chips.map(c => `<button class="chip ${picked.has(c) ? 'on' : ''}" data-c="${c}">${c === 'flow' ? '' : c + ' '}${esc(LABELS[c] || '')}</button>`).join('')}</div></div>
        <div class="spacer"></div>
        <button class="btn" data-go>start · ${Math.min(10, sel.length)} questions</button>`, { back: home, backLabel: 'home' });
      on(main, '[data-p]', el => { part = +el.dataset.p; picked = new Set(); draw(); });
      on(main, '[data-all]', () => { picked = new Set(); draw(); });
      on(main, '[data-c]', el => { const c = el.dataset.c; picked.has(c) ? picked.delete(c) : picked.add(c); draw(); });
      on(main, '[data-go]', () => runTest({
        title: `part ${part} test`, items: shuffle(sel).slice(0, 10),
        onEnd: res => { S.tests['p' + part] = Math.max(S.tests['p' + part] || 0, res.pct); save(); testResult(res, { again: () => sectionSetup(part) }); }
      }));
    };
    draw();
  }

  // ── full plan test (weighted by the marking sheet) ──
  function fullSetup() {
    let timed = false;
    const main = screen(`
      <div><p class="lab">full plan test</p><h1>the whole plan</h1></div>
      <div class="card"><p style="margin:0">40 questions from all eight parts, weighted like the marking sheet: Part 7 (15%) gets the most. You see the answer after each one, and get a breakdown by part at the end.</p></div>
      <label class="card switch"><span><b>timed</b><br><span class="muted" style="font-size:14px">20 minutes on the clock</span></span><input type="checkbox" data-t></label>
      <div class="spacer"></div><button class="btn" data-go>start the test</button>`, { back: home, backLabel: 'home' });
    main.querySelector('[data-t]').onchange = e => { timed = e.target.checked; };
    on(main, '[data-go]', () => {
      const W = D.weights, sum = W.reduce((a, b) => a + b, 0), raw = W.map(w => 40 * w / sum);
      const alloc = raw.map(Math.floor); let left = 40 - alloc.reduce((a, b) => a + b, 0);
      raw.map((x, i) => [x - Math.floor(x), W[i], i]).sort((a, b) => b[0] - a[0] || b[1] - a[1]).slice(0, left).forEach(([, , i]) => alloc[i]++);
      let items = [];
      D.parts.forEach((p, i) => { items = items.concat(shuffle(BANK.filter(x => x.part === p.n)).slice(0, alloc[i])); });
      runTest({ title: 'full plan test', items: shuffle(items), timer: timed ? 20 * 60 : 0, onEnd: res => { S.tests.full = Math.max(S.tests.full || 0, res.pct); save(); testResult(res, { again: fullSetup, byPart: true }); } });
    });
  }

  function runTest(cfg) {
    const items = cfg.items, ans = []; let k = 0, endAt = cfg.timer ? Date.now() + cfg.timer * 1000 : 0, iv = 0;
    const finish = () => {
      clearInterval(iv);
      const right = ans.filter(a => a.ok).length;
      cfg.onEnd({ title: cfg.title, items, ans, right, total: items.length, pct: items.length ? Math.round(right / items.length * 100) : 0 });
    };
    const ask = () => {
      if (k >= items.length) return finish();
      const main = screen(`<div class="prog">${items.map((_, i) => `<i class="${i < k ? 'on' : i === k ? 'cur' : ''}"></i>`).join('')}</div>
        <div class="hud"><span>${esc(cfg.title)} · <b>${k + 1}</b>/${items.length}</span><span>${endAt ? '<b data-clock></b>' : `part ${items[k].part}`}</span></div>
        <div data-stage style="display:flex;flex-direction:column;gap:14px"></div>`, { back: () => confirmLeave(home) });
      if (endAt) {
        const clk = () => { const s = Math.max(0, Math.round((endAt - Date.now()) / 1000)); const c = main.querySelector('[data-clock]'); if (c) c.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if (s <= 0) { items.length = ans.length; finish(); } };
        clearInterval(iv); clk(); iv = setInterval(clk, 1000); onLeave(() => clearInterval(iv));
      }
      mcq(main.querySelector('[data-stage]'), items[k], { onDone: ok => { k++; ask(); }, onAnswer: ok => ans.push({ item: items[k], ok }), nextLabel: k === items.length - 1 ? 'see results' : 'next' });
    };
    ask();
  }

  function testResult(res, o) {
    const misses = res.ans.filter(a => !a.ok);
    let bars = '', weakest = null;
    if (o.byPart) {
      const by = D.parts.map(p => { const a = res.ans.filter(x => x.item.part === p.n); return { n: p.n, t: a.length, r: a.filter(x => x.ok).length }; });
      bars = `<div class="card" style="display:flex;flex-direction:column;gap:10px"><p class="lab" style="margin:0">by part</p>${by.map(b => `<div class="bar"><span>part ${b.n}</span><span class="tr"><i style="width:${b.t ? Math.round(b.r / b.t * 100) : 0}%"></i></span><span>${b.r}/${b.t}</span></div>`).join('')}</div>`;
      const cand = by.filter(b => b.t).sort((a, b) => a.r / a.t - b.r / b.t || D.weights[b.n - 1] - D.weights[a.n - 1]);
      if (cand.length && cand[0].r < cand[0].t) weakest = cand[0].n;
    }
    const st = starsFor(res.pct / 100);
    const main = screen(`
      <div><p class="lab">${esc(res.title)}</p><h1>your result</h1></div>
      <div class="card" style="text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center"><span class="dot"></span><div class="big">${res.pct}%</div><div class="muted">${res.right} of ${res.total} right</div>${starStr(st)}</div>
      ${bars}
      ${weakest ? `<button class="btn" data-w>practise part ${weakest}: ${esc(PART[weakest].title)}</button>` : ''}
      ${misses.length ? `<div class="card"><p class="lab">fix these (added to your review pile)</p>${misses.map(m => `<div class="miss"><b>${esc(m.item.q)}</b><br>${esc(m.item.a[m.item.c])}<br><span class="src">${esc(secLabel(m.item.src))}</span></div>`).join('')}</div>` : '<div class="card"><b>A clean sheet.</b></div>'}
      <div class="row"><button class="btn ghost" data-a>retake</button><button class="btn" data-h>home</button></div>`, { back: home, backLabel: 'home' });
    if (res.pct >= 90) confetti();
    on(main, '[data-w]', () => sectionSetup(weakest)); on(main, '[data-a]', o.again); on(main, '[data-h]', home);
  }

  // ── review pile ──
  function review() {
    const ids = Object.keys(S.review).filter(id => BY_ID[id]);
    if (!ids.length) {
      const main = screen(`<div><p class="lab">review pile</p><h1>nothing to fix</h1></div><div class="card"><p style="margin:0">Anything you miss in a mission or test lands here. Get it right twice and it leaves the pile.</p></div><div class="spacer"></div><button class="btn" data-h>home</button>`, { back: home, backLabel: 'home' });
      return on(main, '[data-h]', home);
    }
    runTest({ title: 'review pile', items: shuffle(ids).slice(0, 10).map(id => BY_ID[id]), onEnd: res => testResult(res, { again: review }) });
  }

  // ── final round: the 45 minutes ──
  function final() {
    const order = { type: 'order', title: 'the running order', hint: 'Tap the eight parts in presenting order.', items: D.parts.map(p => `Part ${p.n} · ${p.title}`), notes: D.parts.map(p => `${p.presenter} · ${p.minutes} min. ${p.handover}`), src: 'flow' };
    const lede = { type: 'match', title: 'match the opening lines', mode: 'lede', src: 'flow' };
    const gaunt = shuffle(BANK.filter(x => x.kind === 'panel')).slice(0, 15);
    STEPS.gauntlet = (stage, ctx, done) => stepHotseat(stage, ctx, done, gaunt, 25);
    runSteps({
      title: 'the 45 minutes', part: { n: 0 },
      steps: [{ t: 'order', g: order }, { t: 'match', g: lede }, { t: 'gauntlet', g: { title: 'panel gauntlet' } }],
      onEnd: (r, t) => {
        const pct = t ? r / t : 0, st = starsFor(pct);
        S.stars.final = Math.max(S.stars.final || 0, st); save();
        result({ title: 'the 45 minutes', pct, stars: st, again: final, handover: 'Opening 2 minutes, eight parts, close 2 minutes: 45 minutes, then 30 minutes of panel questions.' });
      }
    });
  }

  home();
})();

</script>
</body>
</html>
